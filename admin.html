<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha 3v3 — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #B8922A;
    --black: #1A1A1A;
    --surface: #FFFFFF;
    --surface2: #F5F5F5;
    --border: #E0E0E0;
    --text: #1A1A1A;
    --text-muted: #777777;
    --boys: #2563EB;
    --girls: #C026A0;
    --green: #16A34A;
    --red: #DC2626;
    --yellow: #CA8A04;
    --bg: #F0F2F5;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* LOGIN */
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-box { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 48px 40px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .login-title { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .login-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; padding: 11px 14px; outline: none; margin-bottom: 10px; }
  .login-input:focus { border-color: var(--gold); }
  .login-btn { width: 100%; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: white; background: var(--gold); border: none; padding: 12px; border-radius: 6px; cursor: pointer; }
  .login-btn:hover { background: #9a7822; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }

  /* ADMIN */
  .admin-screen { display: none; max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .admin-logo { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--gold); }
  .admin-logo span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .refresh-btn { font-size: 13px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: white; color: var(--text-muted); cursor: pointer; }
  .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }
  .last-updated { font-size: 12px; color: var(--text-muted); }

  /* NAV TABS */
  .nav-tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
  .nav-tab { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 8px 18px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
  .nav-tab:hover { color: var(--gold); }
  .nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* WEEK TABS */
  .week-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .week-tab { font-size: 13px; font-weight: 500; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--border); background: white; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
  .week-tab:hover { border-color: var(--gold); color: var(--gold); }
  .week-tab.active { background: var(--gold); border-color: var(--gold); color: white; }

  .loading { text-align: center; padding: 60px 24px; color: var(--text-muted); font-size: 15px; }
  .error-msg { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 14px 18px; color: var(--red); font-size: 13px; margin-bottom: 20px; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
  .stat-num { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.yellow { color: var(--yellow); }
  .stat-num.blue { color: var(--boys); }
  .stat-num.pink { color: var(--girls); }

  .section-block { margin-bottom: 24px; }
  .section-heading { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .section-heading .count { background: var(--surface2); color: var(--text-muted); padding: 1px 7px; border-radius: 10px; font-size: 11px; }

  .division-block { margin-bottom: 12px; }
  .division-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 4px; display: inline-block; }
  .division-label.boys { background: #DBEAFE; color: var(--boys); }
  .division-label.girls { background: #FCE7F3; color: var(--girls); }
  .age-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 4px 10px; margin-top: 4px; }

  /* TEAM ROW — fixed 4-col grid */
  .team-row {
    display: grid;
    grid-template-columns: 200px 140px 130px 1fr;
    gap: 0;
    align-items: center;
    padding: 9px 12px;
    background: white;
    border: 1px solid var(--border);
    border-left: 4px solid transparent;
    margin-bottom: 2px;
    border-radius: 0 4px 4px 0;
  }
  .team-row.boys-row { border-left-color: var(--boys); }
  .team-row.girls-row { border-left-color: var(--girls); }
  .team-row.unpaid { border-left-color: var(--red); background: #fef9f9; }
  .team-row.reach { border-left-color: var(--yellow); background: #fefdf0; }

  .team-name { font-weight: 600; font-size: 14px; color: var(--text); padding-right: 12px; }
  .team-contact { font-size: 13px; color: var(--text-muted); padding-right: 12px; }
  .team-phone { font-size: 13px; color: var(--text-muted); font-family: 'Inter', sans-serif; padding-right: 12px; }
  .team-notes { font-size: 12px; color: var(--text-muted); display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

  .badge { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; display: inline-block; white-space: nowrap; }
  .badge.paid { background: #DCFCE7; color: var(--green); }
  .badge.unpaid { background: #FEE2E2; color: var(--red); }
  .badge.reach { background: #FEF9C3; color: var(--yellow); }
  .badge.door { background: #F3F4F6; color: #6B7280; }
  .badge.full { background: #FEF3C7; color: var(--gold); }
  .badge.weekly { background: #F3F4F6; color: #6B7280; }
  .badge.note-red { background: #FEE2E2; color: var(--red); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

  .empty-state { padding: 16px 12px; font-size: 13px; color: var(--text-muted); font-style: italic; }

  /* SCHEDULER */
  .scheduler { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 24px; }
  .scheduler-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .ctrl-input { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; }
  .ctrl-input:focus { border-color: var(--gold); }

  .exclusion-area { margin-bottom: 20px; }
  .exclusion-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
  .exclusion-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .exclusion-tag { background: #FEE2E2; color: var(--red); border-radius: 4px; padding: 3px 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .exclusion-tag button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .exclusion-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .excl-select { border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; flex: 1; min-width: 140px; }
  .excl-select:focus { border-color: var(--gold); }
  .excl-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .excl-btn:hover { border-color: var(--gold); }

  .sched-btn { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: white; background: var(--gold); border: none; padding: 11px 28px; border-radius: 6px; cursor: pointer; margin-bottom: 24px; }
  .sched-btn:hover { background: #9a7822; }

  .schedule-output { display: none; }
  .court-block { margin-bottom: 20px; }
  .court-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
  .game-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px; align-items: center; padding: 8px 12px; background: var(--surface2); border-radius: 4px; margin-bottom: 4px; border-left: 3px solid var(--gold); }
  .game-time { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; color: var(--gold); }
  .game-matchup { font-size: 13px; font-weight: 500; }
  .game-matchup .vs { color: var(--text-muted); margin: 0 6px; font-weight: 400; }
  .sched-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .print-btn { font-size: 12px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: white; color: var(--text-muted); cursor: pointer; margin-bottom: 16px; }
  .print-btn:hover { border-color: var(--gold); color: var(--gold); }
  .sched-warning { background: #FEF9C3; border: 1px solid #FDE68A; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--yellow); margin-bottom: 12px; }

  @media (max-width: 700px) {
    .team-row { grid-template-columns: 1fr auto; }
    .team-contact, .team-phone { display: none; }
    .sched-grid { grid-template-columns: 1fr; }
  }
  @media print {
    .nav-tabs, .week-tabs, .stats-row, .section-heading, .refresh-btn, .sched-btn, .print-btn, .scheduler-controls, .exclusion-area { display: none !important; }
    body { background: white; }
    .schedule-output { display: block !important; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">Alpha 3v3</div>
    <div class="login-sub">Admin · Brad Johnson</div>
    <input type="password" class="login-input" id="passInput" placeholder="Password">
    <button class="login-btn" onclick="checkPass()">Enter</button>
    <div class="login-error" id="loginError">Incorrect password</div>
  </div>
</div>

<div class="admin-screen" id="adminScreen">
  <div class="admin-header">
    <div class="admin-logo">Alpha 3v3 <span>Admin Dashboard</span></div>
    <div class="header-right">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showTab('registrations', this)">Registrations</button>
    <button class="nav-tab" onclick="showTab('scheduler', this)">Schedule Builder</button>
  </div>

  <!-- REGISTRATIONS TAB -->
  <div id="tab-registrations">
    <div class="week-tabs" id="weekTabs"></div>
    <div id="mainContent"><div class="loading">Loading registrations...</div></div>
  </div>

  <!-- SCHEDULER TAB -->
  <div id="tab-scheduler" style="display:none">
    <div class="scheduler">
      <div class="scheduler-controls">
        <div class="ctrl-group">
          <div class="ctrl-label">Start time</div>
          <input type="time" class="ctrl-input" id="startTime" value="14:00">
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label">Slot length (min)</div>
          <input type="number" class="ctrl-input" id="slotLen" value="15" min="10" max="30">
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label">Courts available</div>
          <input type="number" class="ctrl-input" id="numCourts" value="4" min="1" max="6">
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label">Games per team</div>
          <input type="number" class="ctrl-input" id="gamesPerTeam" value="3" min="1" max="5">
        </div>
      </div>

      <div class="exclusion-area">
        <div class="exclusion-label">Teams sitting out this week</div>
        <div class="exclusion-list" id="exclusionList"></div>
        <div class="exclusion-row">
          <select class="excl-select" id="exclusionSelect"><option value="">Select team to sit out...</option></select>
          <button class="excl-btn" onclick="addExclusion()">+ Add</button>
        </div>
      </div>

      <div class="exclusion-area">
        <div class="exclusion-label">Required matchups (override)</div>
        <div class="exclusion-list" id="matchupList"></div>
        <div class="exclusion-row">
          <select class="excl-select" id="matchupA"><option value="">Team A...</option></select>
          <span style="font-size:13px;color:var(--text-muted)">vs</span>
          <select class="excl-select" id="matchupB"><option value="">Team B...</option></select>
          <button class="excl-btn" onclick="addMatchup()">+ Add</button>
        </div>
      </div>

      <button class="sched-btn" onclick="generateSchedule()">Generate Schedule</button>

      <div class="schedule-output" id="scheduleOutput">
        <button class="print-btn" onclick="window.print()">🖨 Print schedule</button>
        <div id="schedWarnings"></div>
        <div class="sched-grid" id="schedGrid"></div>
      </div>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'alpha3v3admin';
const AT_TOKEN = 'patMaOytGlSTj9Va0.f38644c7b3405321f4837f5295f7605fcb3438cc8d9db51bb4c20be551fdc864';
const BASE_ID  = 'app78LPAIw7wzc4kl';
const TABLE_ID = 'tblJj5dzDFnlFa7ie';

const AGE_ORDER = {
  '3rd grade':1,'3rd':1,
  '4th/5th grade':2,'4th/5th':2,
  '6th/7th grade':3,'6th/7th':3,
  '8th/9th grade':4,'8th/9th':4,
  '10th-12th grade':5,'10th-12th':5,'10th–12th grade':5
};
const WEEK_ORDER = ['Week 1','Week 2','Week 3','Week 4','Week 5'];
const WEEK_DATES = {'Week 1':'Aug 23','Week 2':'Aug 30','Week 3':'Sep 13','Week 4':'Sep 20','Week 5':'Sep 27'};

let allTeams = [];
let currentWeek = 'Week 2';
let exclusions = [];
let requiredMatchups = [];

function fmtPhone(p){
  if(!p) return '—';
  const d = p.replace(/\D/g,'');
  const n = d.length > 10 ? d.slice(-10) : d;
  if(n.length === 10) return `(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}`;
  return p;
}

function normalizeWeek(w){
  if(!w) return null;
  if(w.includes('Week 1')||w.includes('Aug 23')) return 'Week 1';
  if(w.includes('Week 2')||w.includes('Aug 30')) return 'Week 2';
  if(w.includes('Week 3')||w.includes('Sep 13')) return 'Week 3';
  if(w.includes('Week 4')||w.includes('Sep 20')) return 'Week 4';
  if(w.includes('Week 5')||w.includes('Sep 27')) return 'Week 5';
  return null;
}

function ageRank(a){ return AGE_ORDER[a?.trim()] || 9; }
function divRank(d){ return d==='Boys' ? 0 : 1; }

function checkPass(){
  if(document.getElementById('passInput').value === PASSWORD){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
document.getElementById('passInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPass(); });

function showTab(tab, btn){
  document.getElementById('tab-registrations').style.display = tab==='registrations' ? 'block' : 'none';
  document.getElementById('tab-scheduler').style.display = tab==='scheduler' ? 'block' : 'none';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

async function fetchAll(){
  let records = [], offset = null;
  do {
    const url = new URL(`https://api.airtable.com/v0/${BASE_ID}/${TABLE_ID}`);
    url.searchParams.set('pageSize','100');
    if(offset) url.searchParams.set('offset', offset);
    const res = await fetch(url, { headers:{ Authorization:`Bearer ${AT_TOKEN}` }});
    if(!res.ok) throw new Error(`Airtable error ${res.status}`);
    const data = await res.json();
    records = records.concat(data.records);
    offset = data.offset || null;
  } while(offset);
  return records;
}

async function loadData(){
  document.getElementById('mainContent').innerHTML = '<div class="loading">Loading...</div>';
  try {
    const records = await fetchAll();
    const raw = records.map(r => {
      const f = r.fields;
      const isPaid = f['Paid'] === true || f['Paid'] === 'checked' || f['Paid'] === 1;
      const notes = (f['Notes'] || '').trim();
      const payingAtDoor = notes.toLowerCase().includes('paying at door') || notes.toLowerCase().includes('cash');
      return {
        id: r.id,
        name: f['Team Name'] || '',
        division: f['Division'] || '',
        age: (f['Age Group'] || '').trim(),
        contact: f['Contact Name'] || '',
        phone: fmtPhone(f['Phone'] || ''),
        commitment: f['Commitment'] || '',
        week: normalizeWeek(f['Week'] || ''),
        paid: isPaid,
        payingAtDoor,
        notes,
        submitted: f['Submitted At'] || ''
      };
    });

    // Deduplicate by team name — prefer paid entry
    const nameMap = {};
    raw.forEach(t => {
      const key = t.name.toLowerCase().trim();
      if(!nameMap[key] || (t.paid && !nameMap[key].paid) || (t.week && !nameMap[key].week)){
        nameMap[key] = t;
      }
    });
    allTeams = Object.values(nameMap);

    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    buildTabs();
    renderWeek(currentWeek);
    buildSchedulerDropdowns();
  } catch(err){
    document.getElementById('mainContent').innerHTML =
      `<div class="error-msg">Failed to load: ${err.message}</div>`;
  }
}

function buildTabs(){
  const weeks = WEEK_ORDER.filter(w => allTeams.some(t => t.week===w || t.commitment==='Full Season'));
  if(!weeks.includes('Week 1')) weeks.unshift('Week 1');
  document.getElementById('weekTabs').innerHTML = weeks.map(w =>
    `<button class="week-tab${w===currentWeek?' active':''}" onclick="switchWeek('${w}',this)">${w} — ${WEEK_DATES[w]||''}</button>`
  ).join('');
}

function switchWeek(week, btn){
  currentWeek = week;
  document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderWeek(week);
}

function getConfirmedForWeek(week){
  const confirmed = [];
  const seen = new Set();
  allTeams.forEach(t => {
    const inForWeek = t.commitment==='Full Season'
      ? t.paid
      : (t.week===week && (t.paid || t.payingAtDoor));
    if(inForWeek && !seen.has(t.name.toLowerCase())){
      seen.add(t.name.toLowerCase());
      confirmed.push(t);
    }
  });
  return confirmed;
}

function renderWeek(week){
  const confirmed = getConfirmedForWeek(week);

  // Unpaid: registered for this week, not paid, not paying at door
  const confirmedNames = new Set(confirmed.map(t=>t.name.toLowerCase()));
  const unpaid = allTeams.filter(t =>
    t.week===week && !t.paid && !t.payingAtDoor && !confirmedNames.has(t.name.toLowerCase())
  );

  // Reach out: weekly teams from previous week not in this week
  let reachOut = [];
  if(week !== 'Week 1'){
    const prevWeek = WEEK_ORDER[WEEK_ORDER.indexOf(week)-1];
    const currAll = new Set(allTeams.filter(t => t.week===week || t.commitment==='Full Season').map(t=>t.name.toLowerCase()));
    reachOut = allTeams.filter(t => t.week===prevWeek && t.commitment==='Weekly' && !currAll.has(t.name.toLowerCase()));
    const seenR = new Set();
    reachOut = reachOut.filter(t => { if(seenR.has(t.name.toLowerCase())) return false; seenR.add(t.name.toLowerCase()); return true; });
  }

  const sort = arr => [...arr].sort((a,b) => divRank(a.division)-divRank(b.division) || ageRank(a.age)-ageRank(b.age) || a.name.localeCompare(b.name));
  const boys = confirmed.filter(t=>t.division==='Boys');
  const girls = confirmed.filter(t=>t.division==='Girls');

  let html = `<div class="stats-row">
    <div class="stat-card"><div class="stat-label">Confirmed</div><div class="stat-num green">${confirmed.length}</div></div>
    <div class="stat-card"><div class="stat-label">Boys</div><div class="stat-num blue">${boys.length}</div></div>
    <div class="stat-card"><div class="stat-label">Girls</div><div class="stat-num pink">${girls.length}</div></div>
    <div class="stat-card"><div class="stat-label">Unpaid</div><div class="stat-num red">${unpaid.length}</div></div>
    ${week!=='Week 1'?`<div class="stat-card"><div class="stat-label">Reach Out</div><div class="stat-num yellow">${reachOut.length}</div></div>`:''}
  </div>`;

  html += `<div class="section-block">
    <div class="section-heading">✓ Confirmed for ${week} <span class="count">${confirmed.length} teams</span></div>
    ${renderGrouped(sort(confirmed))}
  </div>`;

  if(unpaid.length){
    html += `<div class="section-block">
      <div class="section-heading" style="color:var(--red)">⚠ Registered — Not Paid <span class="count">${unpaid.length}</span></div>
      ${renderGrouped(sort(unpaid), true)}
    </div>`;
  }

  if(reachOut.length){
    html += `<div class="section-block">
      <div class="section-heading" style="color:var(--yellow)">📞 Not Signed Up for ${week} <span class="count">${reachOut.length}</span></div>
      ${renderGrouped(sort(reachOut), false, true)}
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
}

function renderGrouped(teams, isUnpaid=false, isReach=false){
  let html = '';
  ['Boys','Girls'].forEach(div => {
    const divTeams = teams.filter(t=>t.division===div);
    if(!divTeams.length) return;
    html += `<div class="division-block"><div class="division-label ${div.toLowerCase()}">${div}</div>`;
    const ages = [...new Set(divTeams.map(t=>t.age||'Unknown'))].sort((a,b)=>ageRank(a)-ageRank(b));
    ages.forEach(age => {
      html += `<div class="age-label">${age}</div>`;
      divTeams.filter(t=>(t.age||'Unknown')===age).forEach(t => {
        const rowClass = isUnpaid ? 'unpaid' : isReach ? 'reach' : (div==='Boys'?'boys-row':'girls-row');
        let notesHtml = '';
        if(isUnpaid) notesHtml = `<span class="badge note-red">${t.notes || 'No payment'}</span>`;
        else if(isReach) notesHtml = `<span class="badge reach">Reach Out</span>`;
        else {
          const commitBadge = t.commitment==='Full Season'
            ? `<span class="badge full">Season</span>`
            : `<span class="badge weekly">Weekly</span>`;
          const doorBadge = t.payingAtDoor ? `<span class="badge door">At Door</span>` : '';
          const notesBadge = t.notes && !t.payingAtDoor ? `<span class="badge door" title="${t.notes}">${t.notes.slice(0,20)}${t.notes.length>20?'…':''}</span>` : '';
          notesHtml = commitBadge + doorBadge + notesBadge;
        }
        html += `<div class="team-row ${rowClass}">
          <div class="team-name">${t.name}</div>
          <div class="team-contact">${t.contact||'—'}</div>
          <div class="team-phone">${t.phone||'—'}</div>
          <div class="team-notes">${notesHtml}</div>
        </div>`;
      });
    });
    html += `</div>`;
  });
  return html || '<div class="empty-state">No teams.</div>';
}

// ── SCHEDULER ──
function buildSchedulerDropdowns(){
  const confirmed = getConfirmedForWeek(currentWeek);
  const names = confirmed.map(t=>t.name).sort();
  ['exclusionSelect','matchupA','matchupB'].forEach(id => {
    const el = document.getElementById(id);
    const first = el.options[0];
    el.innerHTML = '';
    el.appendChild(first);
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      el.appendChild(opt);
    });
  });
}

function addExclusion(){
  const val = document.getElementById('exclusionSelect').value;
  if(!val || exclusions.includes(val)) return;
  exclusions.push(val);
  renderExclusions();
}

function removeExclusion(name){
  exclusions = exclusions.filter(e=>e!==name);
  renderExclusions();
}

function renderExclusions(){
  document.getElementById('exclusionList').innerHTML = exclusions.map(e =>
    `<div class="exclusion-tag">${e} <button onclick="removeExclusion('${e.replace(/'/g,"\\'")}')">×</button></div>`
  ).join('');
}

function addMatchup(){
  const a = document.getElementById('matchupA').value;
  const b = document.getElementById('matchupB').value;
  if(!a || !b || a===b) return;
  const key = [a,b].sort().join('|||');
  if(requiredMatchups.find(m=>m.key===key)) return;
  requiredMatchups.push({a, b, key});
  renderMatchups();
}

function removeMatchup(key){
  requiredMatchups = requiredMatchups.filter(m=>m.key!==key);
  renderMatchups();
}

function renderMatchups(){
  document.getElementById('matchupList').innerHTML = requiredMatchups.map(m =>
    `<div class="exclusion-tag" style="background:#DBEAFE;color:var(--boys)">${m.a} vs ${m.b} <button style="color:var(--boys)" onclick="removeMatchup('${m.key.replace(/'/g,"\\'")}')">×</button></div>`
  ).join('');
}

function generateSchedule(){
  const confirmed = getConfirmedForWeek(currentWeek).filter(t => !exclusions.includes(t.name));
  const numCourts = parseInt(document.getElementById('numCourts').value) || 4;
  const slotLen   = parseInt(document.getElementById('slotLen').value) || 15;
  const gamesPerTeam = parseInt(document.getElementById('gamesPerTeam').value) || 3;
  const startTime = document.getElementById('startTime').value || '14:00';

  const [sh, sm] = startTime.split(':').map(Number);
  const startMins = sh * 60 + sm;

  const teams = confirmed.map(t => t.name);
  if(teams.length < 2){ alert('Not enough confirmed teams to schedule.'); return; }

  // Build all possible matchups
  let pairs = [];
  for(let i=0; i<teams.length; i++){
    for(let j=i+1; j<teams.length; j++){
      pairs.push([teams[i], teams[j]]);
    }
  }

  // Shuffle pairs but put required matchups first
  const reqKeys = new Set(requiredMatchups.map(m=>m.key));
  const reqPairs = requiredMatchups.map(m=>[m.a, m.b]);
  const otherPairs = pairs.filter(p => !reqKeys.has([p[0],p[1]].sort().join('|||')));
  // Shuffle other pairs
  for(let i=otherPairs.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [otherPairs[i], otherPairs[j]] = [otherPairs[j], otherPairs[i]];
  }
  const allPairs = [...reqPairs, ...otherPairs];

  // Track games per team and last slot played
  const teamGames = {};
  const teamLastSlot = {};
  teams.forEach(t => { teamGames[t] = 0; teamLastSlot[t] = -1; });

  // Schedule: slots × courts
  const maxSlots = Math.ceil((teams.length * gamesPerTeam) / (numCourts * 2)) + 8;
  const schedule = []; // array of {slot, court, teamA, teamB}
  const usedPairs = new Set();

  for(let slot=0; slot<maxSlots; slot++){
    const courtsThisSlot = [];
    const playingThisSlot = new Set();

    for(let court=1; court<=numCourts; court++){
      // Find a valid pair
      let assigned = false;
      for(let pi=0; pi<allPairs.length; pi++){
        const [a,b] = allPairs[pi];
        const pairKey = [a,b].sort().join('|||');
        if(usedPairs.has(pairKey)) continue;
        if(playingThisSlot.has(a) || playingThisSlot.has(b)) continue;
        if(teamLastSlot[a] === slot-1 || teamLastSlot[b] === slot-1) continue; // no back to back
        if(teamGames[a] >= gamesPerTeam || teamGames[b] >= gamesPerTeam) continue;

        usedPairs.add(pairKey);
        playingThisSlot.add(a);
        playingThisSlot.add(b);
        teamGames[a]++;
        teamGames[b]++;
        teamLastSlot[a] = slot;
        teamLastSlot[b] = slot;

        const timeMins = startMins + slot * slotLen;
        const h = Math.floor(timeMins/60);
        const m = timeMins%60;
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h > 12 ? h-12 : h===0 ? 12 : h;
        const timeStr = `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;

        // Court 1 & 2 preference: try to put required matchups there
        schedule.push({ slot, court, teamA: a, teamB: b, time: timeStr });
        assigned = true;
        break;
      }
    }
    // Check if all teams have their games
    const done = teams.every(t => teamGames[t] >= gamesPerTeam);
    if(done) break;
  }

  // Warnings
  const warnings = [];
  teams.forEach(t => {
    if(teamGames[t] < gamesPerTeam) warnings.push(`${t} only has ${teamGames[t]} game(s) scheduled (needs ${gamesPerTeam})`);
  });

  // Group by court
  const byCourt = {};
  for(let c=1; c<=numCourts; c++) byCourt[c] = [];
  schedule.forEach(g => byCourt[g.court].push(g));

  let html = '';
  if(warnings.length){
    html += `<div class="sched-warning">⚠ ${warnings.join('<br>')}</div>`;
  }
  document.getElementById('schedWarnings').innerHTML = '';

  html += `<div class="sched-grid">`;
  for(let c=1; c<=numCourts; c++){
    const games = byCourt[c].sort((a,b)=>a.slot-b.slot);
    html += `<div class="court-block">
      <div class="court-title">Court ${c}</div>
      ${games.length ? games.map(g => `
        <div class="game-row">
          <div class="game-time">${g.time}</div>
          <div class="game-matchup">${g.teamA}<span class="vs">vs</span>${g.teamB}</div>
        </div>`).join('') : '<div class="empty-state">No games assigned.</div>'}
    </div>`;
  }
  html += `</div>`;

  document.getElementById('schedGrid').innerHTML = html;
  document.getElementById('schedWarnings').innerHTML = warnings.length
    ? `<div class="sched-warning">⚠ ${warnings.join('<br>')}</div>` : '';
  document.getElementById('scheduleOutput').style.display = 'block';
}
</script>
