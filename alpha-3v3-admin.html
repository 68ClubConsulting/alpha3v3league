<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha 3v3 — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --black: #0A0A0A;
    --surface: #111111;
    --surface2: #1A1A1A;
    --border: rgba(201,168,76,0.2);
    --text: #F0EAD6;
    --text-muted: #9A9080;
    --boys: #4A90D9;
    --girls: #D96B8A;
    --green: #4CAF7D;
    --red: #E05A2B;
    --yellow: #E8B84B;
  }
  body { background: var(--black); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* LOGIN */
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 48px 40px; max-width: 360px; width: 100%; text-align: center; }
  .login-title { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
  .login-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; padding: 12px 14px; outline: none; margin-bottom: 12px; -webkit-appearance: none; appearance: none; }
  .login-input:focus { border-color: var(--gold); }
  .login-btn { width: 100%; font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--black); background: var(--gold); border: none; padding: 13px; border-radius: 2px; cursor: pointer; transition: background 0.15s; }
  .login-btn:hover { background: var(--gold-light); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* ADMIN */
  .admin-screen { display: none; max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
  .admin-logo { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; }
  .admin-logo span { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 10px; }

  .week-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .week-tab { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 18px; border-radius: 2px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
  .week-tab:hover { border-color: var(--gold); color: var(--gold); }
  .week-tab.active { background: var(--gold); border-color: var(--gold); color: var(--black); }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 16px 18px; }
  .stat-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .stat-num { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: var(--gold); }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.yellow { color: var(--yellow); }

  .section-block { margin-bottom: 32px; }
  .section-heading { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .section-heading .count { font-size: 12px; background: var(--surface2); color: var(--text-muted); padding: 2px 8px; border-radius: 2px; }

  .division-block { margin-bottom: 20px; }
  .division-label { font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; padding: 6px 12px; border-radius: 2px; margin-bottom: 6px; display: inline-block; }
  .division-label.boys { background: rgba(74,144,217,0.15); color: var(--boys); }
  .division-label.girls { background: rgba(217,107,138,0.15); color: var(--girls); }

  .age-group { margin-bottom: 4px; }
  .age-label { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); padding: 4px 12px; }

  .team-row { display: grid; grid-template-columns: 1fr 160px 140px 100px; gap: 12px; align-items: center; padding: 10px 14px; background: var(--surface); border-left: 3px solid transparent; margin-bottom: 2px; border-radius: 0 2px 2px 0; }
  .team-row.boys-row { border-left-color: var(--boys); }
  .team-row.girls-row { border-left-color: var(--girls); }
  .team-row.unpaid { border-left-color: var(--red); background: rgba(224,90,43,0.06); }
  .team-row.needs-reach { border-left-color: var(--yellow); background: rgba(232,184,75,0.06); }

  .team-name { font-weight: 500; color: var(--text); font-size: 14px; }
  .team-contact { font-size: 13px; color: var(--text-muted); }
  .team-phone { font-size: 13px; color: var(--text-muted); font-family: 'Inter', sans-serif; }
  .team-status { text-align: right; }

  .badge { font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 2px; display: inline-block; }
  .badge.paid { background: rgba(76,175,125,0.15); color: var(--green); }
  .badge.unpaid { background: rgba(224,90,43,0.15); color: var(--red); }
  .badge.reach { background: rgba(232,184,75,0.15); color: var(--yellow); }
  .badge.full { background: rgba(201,168,76,0.12); color: var(--gold); }
  .badge.weekly { background: rgba(255,255,255,0.06); color: var(--text-muted); }

  @media (max-width: 640px) {
    .team-row { grid-template-columns: 1fr 1fr; gap: 6px; }
    .team-phone { display: none; }
  }
</style>
</head>

    <div class="section-block">

</div>

// ── RENDER HELPERS ──
function groupByDivisionAndAge(teams) {
  const groups = {};
  teams.forEach(t => {
    const div = t.division || 'Unknown';
    const age = t.age || 'Unknown';
    if (!groups[div]) groups[div] = {};
    if (!groups[div][age]) groups[div][age] = [];
    groups[div][age].push(t);
  });
  return groups;
}

function renderTeamRow(t, rowClass, showBadge, badgeText, badgeClass) {
  const divClass = (t.division === 'Boys') ? 'boys-row' : 'girls-row';
  const commitBadge = t.commitment === 'Full Season'
    ? '<span class="badge full">Season</span>'
    : '<span class="badge weekly">Weekly</span>';
  return `
    <div class="team-row ${rowClass || divClass}">
      <div class="team-name">${t.name}</div>
      <div class="team-contact">${t.contact || '—'}</div>
      <div class="team-phone">${t.phone || '—'}</div>
      <div class="team-status">
        ${showBadge ? `<span class="badge ${badgeClass}">${badgeText}</span>` : (t.commitment ? commitBadge : '')}
      </div>
    </div>`;
}

function renderGrouped(teams, container, rowClass, showBadge, badgeText, badgeClass) {
  const el = document.getElementById(container);
  el.innerHTML = '';
  const divOrder = ['Boys', 'Girls'];
  divOrder.forEach(div => {
    const divTeams = teams.filter(t => t.division === div);
    if (!divTeams.length) return;
    const divLabel = `<div class="division-label ${div.toLowerCase()}">${div}</div>`;
    const ageGroups = {};
    divTeams.forEach(t => {
      const age = t.age || 'Unknown';
      if (!ageGroups[age]) ageGroups[age] = [];
      ageGroups[age].push(t);
    });
    const sortedAges = Object.keys(ageGroups).sort((a, b) => (AGE_ORDER[a] || 9) - (AGE_ORDER[b] || 9));
    let html = `<div class="division-block">${divLabel}`;
    sortedAges.forEach(age => {
      html += `<div class="age-group"><div class="age-label">${age}</div>`;
      ageGroups[age].forEach(t => {
        html += renderTeamRow(t, rowClass, showBadge, badgeText, badgeClass);
      });
      html += `</div>`;
    });
    html += `</div>`;
    el.innerHTML += html;
  });
}

function renderSimple(teams, container, rowClass, showBadge, badgeText, badgeClass) {
  const el = document.getElementById(container);
  el.innerHTML = teams.map(t => renderTeamRow(t, rowClass, showBadge, badgeText, badgeClass)).join('');
}

function buildW2() {
  // Stats
  const boys = w2Confirmed.filter(t => t.division === 'Boys').length;
  const girls = w2Confirmed.filter(t => t.division === 'Girls').length;
  document.getElementById('w2-confirmed-count').textContent = w2Confirmed.length;
  document.getElementById('w2-boys-count').textContent = boys;
  document.getElementById('w2-girls-count').textContent = girls;
  document.getElementById('w2-unpaid-count').textContent = w2Unpaid.length;
  document.getElementById('w2-reach-count').textContent = w1ReachOut.length;
  document.getElementById('w2-conf-label').textContent = w2Confirmed.length + ' teams';
  document.getElementById('w2-unpaid-label').textContent = w2Unpaid.length + ' teams';
  document.getElementById('w2-reach-label').textContent = w1ReachOut.length + ' teams';

  renderGrouped(w2Confirmed, 'w2-confirmed-list');
  renderSimple(w2Unpaid, 'w2-unpaid-list', 'unpaid', true, 'No Payment', 'unpaid');
  renderSimple(w1ReachOut, 'w2-reach-list', 'needs-reach', true, 'Reach Out', 'reach');
}

function buildW1() {
  const sorted = [...w1All].sort((a,b) => divSort(a)-divSort(b) || ageSort(a)-ageSort(b));
  document.getElementById('w1-total').textContent = w1All.length;
  document.getElementById('w1-boys').textContent = w1All.filter(t=>t.division==='Boys').length;
  document.getElementById('w1-girls').textContent = w1All.filter(t=>t.division==='Girls').length;
  document.getElementById('w1-paid').textContent = w1All.filter(t=>t.paid).length;
  renderGrouped(sorted, 'w1-list');
}

function showWeek(week, btn) {
  document.getElementById('w2').style.display = week === 'w2' ? 'block' : 'none';
  document.getElementById('w1').style.display = week === 'w1' ? 'block' : 'none';
  document.querySelectorAll('.week-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

function checkPass() {
  const val = document.getElementById('passInput').value;
  if (val === PASSWORD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminScreen').style.display = 'block';
    buildW2();
    buildW1();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

document.getElementById('passInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPass();
});
</script>
